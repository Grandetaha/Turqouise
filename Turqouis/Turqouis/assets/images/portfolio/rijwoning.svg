<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="rwT">
  <title id="rwT">Rijwoningen met trapgevels, middelste gevel fris turquoise</title>

  <!-- sky -->
