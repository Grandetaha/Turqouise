    <rect x="752" y="192" width="46" height="46" rx="8" fill="#cfeeea" stroke="#ffffff" stroke-width="5"/>
    <rect x="688" y="366" width="64" height="84" rx="8" fill="#cfeeea" stroke="#ffffff" stroke-width="5"/>
