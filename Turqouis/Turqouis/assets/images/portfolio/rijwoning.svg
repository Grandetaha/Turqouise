    <ellipse cx="200" cy="130" rx="86" ry="32"/>
    <ellipse cx="276" cy="112" rx="62" ry="24"/>
    <ellipse cx="980" cy="160" rx="74" ry="28"/>
  </g>
  <circle cx="1080" cy="84" r="46" fill="#d3f7f2"/>

