<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="bmT">
  <title id="bmT">Hal met terrazzo motiefbehang en ronde spiegel</title>
  <defs>
    <pattern id="ter" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="#f7fbfa"/>
      <circle cx="30" cy="34" r="9" fill="#5fe3d5"/>
      <path d="M84 20 l26 8 -14 22 -24 -6 Z" fill="#0fc2b1"/>
      <circle cx="112" cy="88" r="6" fill="#0aa596"/>
      <path d="M30 96 l20 -4 6 18 -22 6 Z" fill="#b9f2ea"/>
      <circle cx="66" cy="124" r="5" fill="#0fc2b1"/>
      <path d="M120 40 l14 10 -10 12 Z" fill="#123a44" opacity=".16"/>
      <rect x="116" y="118" width="18" height="9" rx="4.5" fill="#88ddd3"/>
      <circle cx="14" cy="128" r="4" fill="#0aa596"/>
    </pattern>
  </defs>

  <!-- terrazzo wall -->
  <rect width="1200" height="650" fill="url(#ter)"/>
  <rect x="0" y="636" width="1200" height="16" fill="#ffffff"/>

  <!-- floor -->
  <rect x="0" y="650" width="1200" height="250" fill="#efe7d9"/>
  <path d="M0 716 h1200 M0 792 h1200 M220 650 V900 M520 650 V900 M820 650 V900 M1100 650 V900" stroke="#e0d4be" stroke-width="4"/>

  <!-- round mirror -->
  <path d="M600 158 V118" stroke="#123a44" stroke-width="6"/>
  <circle cx="600" cy="112" r="7" fill="#123a44"/>
  <circle cx="600" cy="290" r="122" fill="#cfeeea" stroke="#0aa596" stroke-width="12"/>
  <path d="M544 236 a74 74 0 0 1 44 -38" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".8"/>
  <path d="M524 262 a86 86 0 0 1 18 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".6"/>

  <!-- hooks + tote bag -->
  <circle cx="920" cy="252" r="8" fill="#123a44"/>
  <circle cx="980" cy="252" r="8" fill="#123a44"/>
  <circle cx="1040" cy="252" r="8" fill="#123a44"/>
  <path d="M968 258 q12 16 24 0" fill="none" stroke="#0aa596" stroke-width="6" stroke-linecap="round"/>
  <path d="M952 292 h56 l9 82 h-74 Z" fill="#5fe3d5"/>
  <path d="M962 292 q18 -26 36 0" fill="none" stroke="#0aa596" stroke-width="6"/>

  <!-- bench with cushions -->
  <ellipse cx="600" cy="700" rx="300" ry="26" fill="#0a222b" opacity=".06"/>
  <rect x="392" y="596" width="16" height="92" fill="#d8c7ab"/>
  <rect x="792" y="596" width="16" height="92" fill="#d8c7ab"/>
  <rect x="360" y="540" width="480" height="58" rx="16" fill="#e9e0d3"/>
  <rect x="398" y="494" width="132" height="58" rx="16" fill="#d3f7f2"/>
  <rect x="556" y="494" width="132" height="58" rx="16" fill="#ffffff" stroke="#e2efec" stroke-width="4"/>
  <rect x="714" y="502" width="86" height="50" rx="14" fill="#0fc2b1" transform="rotate(6 757 527)"/>

  <!-- plant -->
  <path d="M110 560 h90 l-14 96 h-62 Z" fill="#0aa596"/>
  <ellipse cx="130" cy="504" rx="18" ry="58" fill="#0fc2b1" transform="rotate(-18 130 504)"/>
  <ellipse cx="168" cy="492" rx="16" ry="66" fill="#5fe3d5" transform="rotate(14 168 492)"/>
  <ellipse cx="194" cy="524" rx="13" ry="44" fill="#088378" transform="rotate(30 194 524)"/>

  <!-- rug -->
  <ellipse cx="620" cy="806" rx="330" ry="50" fill="#d3f7f2" opacity=".8"/>
  <ellipse cx="620" cy="806" rx="240" ry="32" fill="none" stroke="#9fe9df" stroke-width="5"/>
</svg>
